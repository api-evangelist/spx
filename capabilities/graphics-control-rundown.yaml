naftiko: 1.0.0-alpha2
info:
  label: SPX Graphics Control API — Rundown
  description: 'SPX Graphics Control API — Rundown. 4 operations. Lead operation: Focus First Item. Self-contained Naftiko
    capability covering one Spx business surface.'
  tags:
  - Spx
  - Rundown
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPX_API_KEY: SPX_API_KEY
capability:
  consumes:
  - type: http
    namespace: graphics-control-rundown
    baseUri: http://localhost:5656
    description: SPX Graphics Control API — Rundown business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-rundown-focusFirst
      path: /api/v1/rundown/focusFirst
      operations:
      - name: focusfirstitem
        method: GET
        description: Focus First Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-rundown-focusNext
      path: /api/v1/rundown/focusNext
      operations:
      - name: focusnextitem
        method: GET
        description: Focus Next Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-rundown-focusPrevious
      path: /api/v1/rundown/focusPrevious
      operations:
      - name: focuspreviousitem
        method: GET
        description: Focus Previous Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-rundown-load
      path: /api/v1/rundown/load
      operations:
      - name: loadrundown
        method: GET
        description: Load Rundown
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: file
          in: query
          type: string
          description: Path to the rundown file in format ProjectName/RundownName (e.g. MyFirstProject/MyFirstRundown)
          required: true
  exposes:
  - type: rest
    namespace: graphics-control-rundown-rest
    port: 8080
    description: REST adapter for SPX Graphics Control API — Rundown. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/rundown/focusfirst
      name: api-v1-rundown-focusfirst
      description: REST surface for api-v1-rundown-focusFirst.
      operations:
      - method: GET
        name: focusfirstitem
        description: Focus First Item
        call: graphics-control-rundown.focusfirstitem
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/rundown/focusnext
      name: api-v1-rundown-focusnext
      description: REST surface for api-v1-rundown-focusNext.
      operations:
      - method: GET
        name: focusnextitem
        description: Focus Next Item
        call: graphics-control-rundown.focusnextitem
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/rundown/focusprevious
      name: api-v1-rundown-focusprevious
      description: REST surface for api-v1-rundown-focusPrevious.
      operations:
      - method: GET
        name: focuspreviousitem
        description: Focus Previous Item
        call: graphics-control-rundown.focuspreviousitem
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/rundown/load
      name: api-v1-rundown-load
      description: REST surface for api-v1-rundown-load.
      operations:
      - method: GET
        name: loadrundown
        description: Load Rundown
        call: graphics-control-rundown.loadrundown
        with:
          file: rest.file
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graphics-control-rundown-mcp
    port: 9090
    transport: http
    description: MCP adapter for SPX Graphics Control API — Rundown. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: focus-first-item
      description: Focus First Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-rundown.focusfirstitem
      outputParameters:
      - type: object
        mapping: $.
    - name: focus-next-item
      description: Focus Next Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-rundown.focusnextitem
      outputParameters:
      - type: object
        mapping: $.
    - name: focus-previous-item
      description: Focus Previous Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-rundown.focuspreviousitem
      outputParameters:
      - type: object
        mapping: $.
    - name: load-rundown
      description: Load Rundown
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-rundown.loadrundown
      with:
        file: tools.file
      outputParameters:
      - type: object
        mapping: $.
