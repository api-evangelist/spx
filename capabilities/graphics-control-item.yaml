      description: Direct Play Out
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graphics-control-item.directplayout
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: continue-item
      description: Continue Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-item.continueitem
      outputParameters:
      - type: object
        mapping: $.
    - name: play-item
      description: Play Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-item.playitem
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-item
      description: Stop Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graphics-control-item.stopitem
      outputParameters:
      - type: object
        mapping: $.
    - name: update-item
      description: Update Item
