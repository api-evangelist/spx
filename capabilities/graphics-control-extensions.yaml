naftiko: 1.0.0-alpha2
info:
  label: SPX Graphics Control API — Extensions
  description: 'SPX Graphics Control API — Extensions. 1 operations. Lead operation: Invoke Extension Function. Self-contained
    Naftiko capability covering one Spx business surface.'
  tags:
  - Spx
  - Extensions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPX_API_KEY: SPX_API_KEY
capability:
  consumes:
  - type: http
    namespace: graphics-control-extensions
    baseUri: http://localhost:5656
    description: SPX Graphics Control API — Extensions business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-invokeExtensionFunction
      path: /api/v1/invokeExtensionFunction
      operations:
      - name: invokeextensionfunction
        method: POST
        description: Invoke Extension Function
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: graphics-control-extensions-rest
    port: 8080
    description: REST adapter for SPX Graphics Control API — Extensions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/invokeextensionfunction
      name: api-v1-invokeextensionfunction
      description: REST surface for api-v1-invokeExtensionFunction.
      operations:
      - method: POST
        name: invokeextensionfunction
        description: Invoke Extension Function
        call: graphics-control-extensions.invokeextensionfunction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graphics-control-extensions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SPX Graphics Control API — Extensions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: invoke-extension-function
      description: Invoke Extension Function
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graphics-control-extensions.invokeextensionfunction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
